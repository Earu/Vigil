name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v1.0.0), must be an existing tag'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.version || github.ref_name }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      # --no-audit: the registry advisory endpoint stalling turned every install into a
      # seven minute wait for a report nobody reads here, and it is the only registry
      # round trip left once the npm cache hits
      run: npm ci --no-audit --no-fund

    - name: Run tests
      run: npm test

  build:
    needs: test
    # Each runner builds its host architecture: cross-building is not
    # supported because the native modules (keytar, argon2, passport-desktop)
    # are copied for the host arch by electron/copy-native-modules.mjs
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    # id-token and attestations are what the provenance step below needs;
    # nothing else in this job writes anywhere
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.inputs.version || github.ref_name }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      # --no-audit: the registry advisory endpoint stalling turned every install into a
      # seven minute wait for a report nobody reads here, and it is the only registry
      # round trip left once the npm cache hits
      run: npm ci --no-audit --no-fund

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libsecret-1-dev libusb-1.0-0-dev libudev-dev libpcsclite-dev pkgconf xvfb

    # The provisioning profile is not in the repo: it embeds the team name.
    # Restored from a secret so signed builds still get it. Absent, the build
    # is unsigned; absent while a certificate IS configured, electron-builder
    # fails loudly rather than producing an app whose helpers get killed.
    - name: Restore macOS provisioning profile
      if: runner.os == 'macOS'
      env:
        MAC_PROVISION_PROFILE: ${{ secrets.MAC_PROVISION_PROFILE }}
      run: |
        if [ -n "$MAC_PROVISION_PROFILE" ]; then
          printf '%s' "$MAC_PROVISION_PROFILE" | base64 --decode > build/vigil.provisionprofile
          echo "provisioning profile restored"
        else
          echo "no MAC_PROVISION_PROFILE secret, macOS build will be unsigned"
        fi

    # macOS is built through a filter because electron-builder logs the signing
    # identity, and a Developer ID certificate issued to an individual carries
    # a legal name. Referencing SIGNING_IDENTITY_NAME in env is what makes the
    # runner redact it (an unreferenced secret is never sent to the runner, so
    # it cannot be matched); the sed is a second layer that does not depend on
    # GitHub doing that. Public repo, public logs.
    - name: Build Electron app (macOS)
      if: runner.os == 'macOS'
      # shell: bash is what supplies pipefail. The default shell is `bash -e`
      # without it, so a failing build piped into sed would report success and
      # only surface as a missing artifact later
      shell: bash
      run: |
        # An empty CSC_LINK is not the same as an unset one: electron-builder
        # reads it as a path to the certificate, resolves it to the project
        # directory and dies with "not a file". Unsigned runs land here because
        # a GitHub expression that evaluates to nothing still defines the var.
        if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
        if [ -n "$SIGNING_IDENTITY_NAME" ]; then
          npm run electron:build -- --publish never 2>&1 | sed "s/$SIGNING_IDENTITY_NAME/***/g"
        else
          npm run electron:build -- --publish never
        fi
      env:
        SIGNING_IDENTITY_NAME: ${{ secrets.SIGNING_IDENTITY_NAME }}
        NODE_ENV: production
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS signing. Enabled only when the Developer ID secrets are
        # present, so forks and PRs still produce an (unsigned) build instead
        # of failing. Without a signature the app runs, but the biometry-gated
        # keychain rejects it and biometric unlock falls back to the
        # prompt-only path (see electron/native/touchid/README.md)
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' }}
        CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        # Notarization; electron-builder skips it when these are unset
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # This is broken on macOS. Why.
        # See: https://github.com/electron-userland/electron-builder/issues/3179#issuecomment-408347702
        USE_HARD_LINKS: false

    - name: Build Electron app
      if: runner.os != 'macOS'
      run: npm run electron:build -- --publish never
      env:
        NODE_ENV: production
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS signing. Enabled only when the Developer ID secrets are
        # present, so forks and PRs still produce an (unsigned) build instead
        # of failing. Without a signature the app runs, but the biometry-gated
        # keychain rejects it and biometric unlock falls back to the
        # prompt-only path (see electron/native/touchid/README.md)
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' }}
        CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        # Notarization; electron-builder skips it when these are unset
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # This is broken on macOS. Why.
        # See: https://github.com/electron-userland/electron-builder/issues/3179#issuecomment-408347702
        USE_HARD_LINKS: false

    # Before uploading: a release that cannot open a window must never reach
    # the update feed. See build.yml for what is checked
    - name: Boot smoke test
      if: runner.os == 'Linux'
      run: xvfb-run -a node scripts/smoke-boot.mjs -- --ozone-platform=x11

    # The asar is the reproducible part of the build (see
    # scripts/asar-hash.mjs and README > Reproducible builds); its hash ships
    # with the release so a rebuild from the same commit can be compared.
    # Inputs reach the script through env, never by expression substitution
    # into the shell: a tag name is a valid ref with shell metacharacters in
    # it, and this job can mint provenance
    - name: Record the app.asar hash
      shell: bash
      env:
        VERSION: ${{ github.event.inputs.version || github.ref_name }}
        ARCH: ${{ matrix.arch }}
      run: |
        platform="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        node scripts/asar-hash.mjs dist --write "vigil-${platform}-${ARCH}-${VERSION}.asar.sha256"

    # Build provenance: a signed statement, kept in the Sigstore log and on
    # the repository, that these exact bytes came out of this workflow run
    # at this commit. Anyone can check a download against it with
    #   gh attestation verify <file> --repo Earu/Vigil
    # It ties the artifact to the source; it does not make the build
    # reproducible, which is a separate property
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/*.exe
          dist/*.AppImage
          dist/*.dmg
          dist/*.zip
          dist/latest*.yml
          dist/*.asar.sha256

    # The latest*.yml files and .blockmap are the metadata electron-updater
    # reads from the GitHub release; they reference the installer filenames,
    # so nothing may be renamed after this point. The sign job below signs
    # the yml bytes as uploaded here, so those may not be regenerated either
    - name: Upload Windows artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-${{ matrix.arch }}-installer
        path: |
          dist/*.exe
          dist/*.blockmap
          dist/latest.yml
          dist/*.asar.sha256
        if-no-files-found: error

    # The zip and latest-mac.yml are what electron-updater consumes; the dmg
    # alone is a manual download and the updater cannot use it at all
    - name: Upload macOS artifacts
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macos-${{ matrix.arch }}-installer
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*.blockmap
          dist/latest-mac.yml
          dist/*.asar.sha256
        if-no-files-found: error

    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux-${{ matrix.arch }}-installer
        path: |
          dist/*.AppImage
          dist/latest-linux*.yml
          dist/*.asar.sha256
        if-no-files-found: error

  # Installed builds refuse an update whose metadata does not carry this
  # signature (electron/src/update-signature.ts), so a release without it is
  # one nobody receives. The script fails the job when the secret is missing
  # rather than let that happen quietly.
  #
  # Its own job, on purpose: the build jobs run npm ci with install scripts
  # and then electron-builder, and anything a dependency left running there
  # runs as the same user as every later step and can read its environment.
  # The key that every installed build trusts is never in a process tree
  # that has executed third-party code: this job checks out the script and
  # runs it on Node's built-in crypto, with no install step at all
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download update metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: metadata
          pattern: '*-installer'
          merge-multiple: true

      - name: Sign update metadata
        run: node scripts/sign-update-metadata.mjs metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-signatures
          path: metadata/latest*.yml.sig
          if-no-files-found: error

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
