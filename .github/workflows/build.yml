name: Build Electron App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # A manual run is the only one that signs and notarizes. Doing it on every
  # push and pull request would add several minutes and an Apple notary round
  # trip to each, for an artifact nobody installs
  workflow_dispatch:

# Nothing here writes to the repository: the token every job gets is
# read-only, so a dependency's code running in a build step holds nothing
# it could push with
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      # --no-audit: the registry advisory endpoint stalling turned every install into a
      # seven minute wait for a report nobody reads here, and it is the only registry
      # round trip left once the npm cache hits
      run: npm ci --no-audit --no-fund

    # Electron ships no postinstall script, so npm ci never fetches the
    # binary: node_modules/electron/index.js downloads it on the first
    # require, which is inside the test run. That put a hundred megabytes from
    # the GitHub release CDN in the middle of npm test, and a 504 from it read
    # as a failing suite. The cache is @electron/get's own, which setup-node's
    # npm cache does not cover
    - name: Cache the Electron binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

    # Requiring the module is what triggers the download. Done here so a CDN
    # failure is a failing download step that can be retried on its own,
    # rather than a test file that reports as broken
    - name: Fetch the Electron binary
      run: |
        for attempt in 1 2 3; do
          if node -e "require('electron')"; then exit 0; fi
          echo "Electron download failed (attempt $attempt)"
          if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
        done
        echo "Electron binary could not be downloaded after 3 attempts"
        exit 1

    - name: Run tests
      run: npm test

  build:
    needs: test
    # Each runner builds its host architecture. Cross-building is not
    # supported: electron/copy-native-modules.mjs selects prebuilds by
    # process.arch and compiles the Touch ID addon with node-gyp for the host,
    # so a cross build silently produces binaries for the wrong architecture.
    # Windows on arm64 is absent because passport-desktop (Windows Hello)
    # publishes no arm64 prebuild.
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      # --no-audit: the registry advisory endpoint stalling turned every install into a
      # seven minute wait for a report nobody reads here, and it is the only registry
      # round trip left once the npm cache hits
      run: npm ci --no-audit --no-fund

    # Install Linux dependencies
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libnss3 libsecret-1-dev libusb-1.0-0-dev libudev-dev libpcsclite-dev pkgconf xvfb

    # The provisioning profile is not in the repo: it embeds the team name.
    # Restored from a secret so signed builds still get it. Absent, the build
    # is unsigned; absent while a certificate IS configured, electron-builder
    # fails loudly rather than producing an app whose helpers get killed.
    - name: Restore macOS provisioning profile
      if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
      env:
        MAC_PROVISION_PROFILE: ${{ secrets.MAC_PROVISION_PROFILE }}
      run: |
        if [ -n "$MAC_PROVISION_PROFILE" ]; then
          printf '%s' "$MAC_PROVISION_PROFILE" | base64 --decode > build/vigil.provisionprofile
          echo "provisioning profile restored"
        else
          echo "no MAC_PROVISION_PROFILE secret, macOS build will be unsigned"
        fi

    # electron-builder builds its own keychain for the certificate and then
    # calls set-key-partition-list with the certificate's password where the
    # keychain's belongs (app-builder-lib codeSign/macCodeSign.js: the
    # keychain is created with a random password, importCerts passes
    # cscKeyPassword). The runners used to have the keychain unlocked at that
    # point so security never consulted the argument; on the macos-26 images
    # it does, and every signed build fails with "the user name or passphrase
    # you entered is not correct". So the keychain is made here, correctly,
    # and CSC_KEYCHAIN points electron-builder at it instead
    - name: Import the signing certificate
      if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      run: |
        if [ -z "$MAC_CSC_LINK" ]; then
          echo "no MAC_CSC_LINK secret, macOS build will be unsigned"
          exit 0
        fi
        keychain="$RUNNER_TEMP/vigil-signing.keychain-db"
        # This one is the keychain's own, generated here and used nowhere
        # else, so it lives and dies with the job
        password="$(openssl rand -base64 24)"
        security create-keychain -p "$password" "$keychain"
        # Unlocked for the length of the build, and no relock on sleep
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$password" "$keychain"
        # Written under RUNNER_TEMP, removed as soon as it is imported
        cert="$RUNNER_TEMP/certificate.p12"
        printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$cert"
        security import "$cert" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/productbuild
        rm -f "$cert"
        # What electron-builder gets wrong: the keychain's own password
        security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
        # codesign searches the user's keychain list, so the new one has to
        # join it rather than replace it
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

    # macOS is built through a filter because electron-builder logs the signing
    # identity, and a Developer ID certificate issued to an individual carries
    # a legal name. Referencing SIGNING_IDENTITY_NAME in env is what makes the
    # runner redact it (an unreferenced secret is never sent to the runner, so
    # it cannot be matched); the sed is a second layer that does not depend on
    # GitHub doing that. Public repo, public logs.
    - name: Build Electron app (macOS)
      if: runner.os == 'macOS'
      # shell: bash is what supplies pipefail. The default shell is `bash -e`
      # without it, so a failing build piped into sed would report success and
      # only surface as a missing artifact later
      shell: bash
      run: |
        if [ -n "$SIGNING_IDENTITY_NAME" ]; then
          npm run electron:build -- --publish never 2>&1 | sed "s/$SIGNING_IDENTITY_NAME/***/g"
        else
          npm run electron:build -- --publish never
        fi
      env:
        SIGNING_IDENTITY_NAME: ${{ secrets.SIGNING_IDENTITY_NAME }}
        NODE_ENV: production
        # macOS signing, on manual runs only, and only when the secrets exist
        # so forks still build. Everything else produces an unsigned app: it
        # runs, but the biometry-gated keychain rejects it and biometric
        # unlock falls back to the prompt-only path. Verifying that path is
        # what a manual dispatch is for (see electron/native/touchid/README.md)
        # The identity lives in the keychain the step above made; CSC_LINK
        # is deliberately unset, since electron-builder builds a keychain of
        # its own whenever it is given one and that path is broken
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && secrets.MAC_CSC_LINK != '' }}
        # Notarization; electron-builder skips it when these are unset
        APPLE_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_ID || '' }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        APPLE_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_TEAM_ID || '' }}
        # This is broken on macOS. Why.
        # See: https://github.com/electron-userland/electron-builder/issues/3179#issuecomment-408347702
        USE_HARD_LINKS: false
    - name: Build Electron app
      if: runner.os != 'macOS'
      run: npm run electron:build -- --publish never
      env:
        NODE_ENV: production
        # macOS signing, on manual runs only, and only when the secrets exist
        # so forks still build. Everything else produces an unsigned app: it
        # runs, but the biometry-gated keychain rejects it and biometric
        # unlock falls back to the prompt-only path. Verifying that path is
        # what a manual dispatch is for (see electron/native/touchid/README.md)
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && secrets.MAC_CSC_LINK != '' }}
        CSC_LINK: ${{ github.event_name == 'workflow_dispatch' && secrets.MAC_CSC_LINK || '' }}
        CSC_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
        # Notarization; electron-builder skips it when these are unset
        APPLE_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_ID || '' }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        APPLE_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_TEAM_ID || '' }}
        # This is broken on macOS. Why.
        # See: https://github.com/electron-userland/electron-builder/issues/3179#issuecomment-408347702
        USE_HARD_LINKS: false

    # Runs the bytes that were just packaged: the unit tests mock every
    # Electron module and the typecheck cannot see a main-process failure
    # that only happens at runtime, so a build that dies before its first
    # window passes both. This fails unless the window exists, the unlock
    # screen rendered and the preload bridge answered an IPC call
    # --disable-gpu: a runner has no GPU, and the software raster under xvfb
    # fails to allocate staging buffers often enough to stall the renderer,
    # which Electron logs as WebContents#unresponsive and this test reads as a
    # failure. Nothing here tests the GPU path, so it does not run one
    - name: Boot smoke test
      if: runner.os == 'Linux'
      run: xvfb-run -a node scripts/smoke-boot.mjs -- --ozone-platform=x11 --disable-gpu

    # Windows artifacts
    - name: Upload Windows artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-${{ matrix.arch }}-installer
        path: |
          dist/*.exe
        if-no-files-found: error

    # macOS artifacts
    - name: Upload macOS artifacts
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macos-${{ matrix.arch }}-installer
        path: |
          dist/*.dmg
        if-no-files-found: error

    # Linux artifacts
    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux-${{ matrix.arch }}-installer
        path: |
          dist/*.AppImage
        if-no-files-found: error